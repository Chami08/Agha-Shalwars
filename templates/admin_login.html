<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Agha Shalwars</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <section class="admin-login">

        <div class="admin-login-box">

            <h1>Agha Shalwars</h1>

            <h2>Admin Login</h2>


            {% if error %}

                <p class="login-error">
                    {{ error }}
                </p>

            {% endif %}


            <form method="POST">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn admin-login-btn">

                    Login

                </button>

            </form>


            <a href="{{ url_for('home') }}"
               class="back-home">

                ← Back to Website

            </a>

        </div>

    </section>

</body>

</html>
